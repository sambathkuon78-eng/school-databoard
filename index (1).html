<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>សាលាបង្វឹក អិល ធីស — ប្រព័ន្ធគ្រប់គ្រង</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Moul&family=Hanuman:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (Firestore) SDK — ត្រូវការសម្រាប់រក្សាទុក/ចែករំលែកទិន្នន័យរវាងអ្នកប្រើច្រើននាក់ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --stone:#1F3A3D;
    --stone-light:#2C5054;
    --stone-dark:#132628;
    --gold:#C89B3C;
    --gold-light:#E4C77C;
    --lacquer:#8B3A3A;
    --lacquer-light:#F4E0DE;
    --sage:#5E7D63;
    --sage-light:#E4EDE3;
    --paper:#F7F4EC;
    --paper-2:#FFFFFF;
    --ink:#20241F;
    --ink-soft:#63695F;
    --line:#E2DCC9;
    --shadow: 0 4px 18px rgba(31,58,61,0.08);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Kantumruy Pro','Hanuman',sans-serif;font-size:14px;}
  h1,h2,h3,.display{font-family:'Moul','Hanuman',serif;font-weight:400;}
  ::selection{background:var(--gold-light);}

  /* ---- kbach motif strip (temple frieze) ---- */
  .motif{
    height:9px;width:100%;
    background:
      linear-gradient(45deg, var(--gold) 25%, transparent 25%) 0 0/12px 12px repeat-x,
      linear-gradient(-45deg, var(--gold) 25%, transparent 25%) 0 0/12px 12px repeat-x;
    opacity:.85;
  }
  .motif.sage{
    background:
      linear-gradient(45deg, var(--sage) 25%, transparent 25%) 0 0/12px 12px repeat-x,
      linear-gradient(-45deg, var(--sage) 25%, transparent 25%) 0 0/12px 12px repeat-x;
  }

  /* ---- layout ---- */
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  .sidebar{
    background:var(--stone);color:#EFEAD9;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
  .brand .seal{
    width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Moul';font-size:19px;color:var(--gold);margin-bottom:10px;
  }
  .brand .seal-logo{
    width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;
    border:2px solid var(--gold);padding:5px;margin-bottom:10px;display:block;
  }
  .brand .name{font-family:'Moul';font-size:16px;line-height:1.5;color:#fff;}
  .brand .sub{font-size:11px;color:#B9C4B9;letter-spacing:.3px;margin-top:2px;}

  nav{padding:14px 10px;flex:1;}
  .nav-group{margin-bottom:16px;}
  .nav-group-label{
    font-size:10.5px;letter-spacing:.6px;color:#9FB0A2;
    padding:6px 12px;text-transform:uppercase;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;cursor:pointer;
    color:#DDE6DA;font-size:13.5px;margin:1px 4px;
    transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);}
  .nav-item.active{background:var(--gold);color:var(--stone-dark);font-weight:600;}
  .nav-item svg{flex-shrink:0;width:16px;height:16px;}
  .nav-item.active svg{stroke:var(--stone-dark);}

  main{padding:0;overflow-x:hidden;}
  .topbar{
    background:var(--paper-2);border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;z-index:5;
  }
  .topbar .title{font-family:'Moul';font-size:19px;color:var(--stone-dark);}
  .topbar .date{font-size:12.5px;color:var(--ink-soft);}
  .content{padding:24px 28px 60px;max-width:1280px;}

  .section{display:none;}
  .section.active{display:block;}

  /* ---- KPI cards ---- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px;}
  .kpi-card{
    background:var(--paper-2);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;border:1px solid var(--line);
  }
  .kpi-card .motif{height:5px;}
  .kpi-body{padding:16px 18px;}
  .kpi-label{font-size:12px;color:var(--ink-soft);}
  .kpi-value{font-family:'Moul';font-size:26px;color:var(--stone-dark);margin-top:4px;}
  .kpi-sub{font-size:11.5px;color:var(--sage);margin-top:3px;}

  /* ---- panel / table card ---- */
  .panel{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 20px;border-bottom:1px solid var(--line);
  }
  .panel-head h2{font-size:16px;margin:0;color:var(--stone-dark);}
  .panel-head .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;font-family:'Kantumruy Pro';}
  .panel-actions{display:flex;gap:8px;align-items:center;}
  .search-box{
    padding:7px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;
    font-family:inherit;width:180px;background:var(--paper);
  }
  .btn{
    border:none;padding:8px 15px;border-radius:7px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:'Kantumruy Pro';display:inline-flex;align-items:center;gap:6px;
    transition:filter .12s, transform .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--stone);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-gold{background:var(--gold);color:var(--stone-dark);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--lacquer);border:1px solid var(--lacquer-light);}
  .btn-ghost:hover{background:var(--lacquer-light);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 16px;background:var(--paper);
    color:var(--ink-soft);font-weight:600;font-size:11.5px;letter-spacing:.2px;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:10px 16px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper);}
  .table-wrap{overflow-x:auto;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:26px;font-size:12.5px;}

  .badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;display:inline-block;}
  .b-green{background:var(--sage-light);color:var(--sage);}
  .b-red{background:var(--lacquer-light);color:var(--lacquer);}
  .b-gold{background:#F7EBCB;color:#8A6A1E;}
  .b-grey{background:#EDEBE2;color:var(--ink-soft);}

  .del-btn{background:none;border:none;cursor:pointer;color:#B9847F;font-size:14px;padding:2px 6px;border-radius:5px;}
  .del-btn:hover{background:var(--lacquer-light);color:var(--lacquer);}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(19,38,40,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--paper-2);border-radius:12px;width:100%;max-width:460px;
    max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;color:var(--stone-dark);}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
  .modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:13px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
    font-family:inherit;font-size:13px;background:var(--paper);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  /* ---- registration form (new student) ---- */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}

  /* ---- toast ---- */
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--stone-dark);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:8px;transform:translateY(20px);opacity:0;
    transition:all .25s;z-index:60;pointer-events:none;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}

  /* mobile */
  .hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--stone-dark);}
  @media (max-width: 880px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;
      transform:translateX(-100%);transition:transform .2s;
    }
    .sidebar.open{transform:translateX(0);}
    .hamburger{display:inline-block;}
    .content{padding:18px 14px 60px;}
    .topbar{padding:14px 16px;}
  }
</style>
</head>

    setSyncBadge("offline");
    return false;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    return true;
  }catch(err){
    console.error("Firebase init failed:", err);
    setSyncBadge("offline");
    return false;
  }
}

async function fetchAllData(){
  if(!initFirebase()) return;
  setSyncBadge("loading");
  try{
    const keys = Object.keys(SCHEMA);
    await Promise.all(keys.map(async key=>{
      const snap = await db.collection("school_data").doc(key).get();
      if(snap.exists){
        const d = snap.data();
        if(Array.isArray(d.data)) SCHEMA[key].data = d.data;
      }
    }));
    firebaseConnected = true;
    setSyncBadge("online");
    render();
    attachRealtimeListeners();
  }catch(err){
    console.error("fetchAllData failed:", err);
    firebaseConnected = false;
    setSyncBadge("offline");
    showToast("មិនអាចភ្ជាប់ Firebase បាន — កំពុងប្រើទិន្នន័យក្នុងម៉ាស៊ីននេះ", true);
  }
}

async function saveSheet(key){
  if(!firebaseConnected || !db) return; // no config set / offline: stay local-only
  try{
    await db.collection("school_data").doc(key).set({ data: SCHEMA[key].data });
  }catch(err){
    console.error("saveSheet failed:", err);
    showToast("រក្សាទុកទៅ Firebase មិនបានជោគជ័យ — សូមពិនិត្យអ៊ីនធឺណិត", true);
  }
}

// ស្តាប់ការផ្លាស់ប្តូរពីអ្នកប្រើផ្សេងទៀតបន្ទាប់ពីភ្ជាប់បានជោគជ័យ — ធ្វើឲ្យអេក្រង់ ១ សិស្សត្រូវ update ភ្លាមៗ
function attachRealtimeListeners(){
  if(realtimeAttached || !db) return;
  realtimeAttached = true;
  Object.keys(SCHEMA).forEach(key=>{
    db.collection("school_data").doc(key).onSnapshot(snap=>{
      if(!snap.exists) return;
      const d = snap.data();
      if(Array.isArray(d.data)){
        SCHEMA[key].data = d.data;
        render();
      }
    }, err=> console.error("onSnapshot failed:", key, err));
  });
}

function businessDaysLate(dueDate, paidDate){
  if(!dueDate || !paidDate) return "";
  const due = new Date(dueDate+"T00:00:00");
  const paid = new Date(paidDate+"T00:00:00");
  if(isNaN(due) || isNaN(paid) || paid<=due) return 0;
  let count = 0;
  const d = new Date(due);
  d.setDate(d.getDate()+1);
  while(d<=paid){
    const day = d.getDay();
    if(day!==0 && day!==6) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}

function renderCell(col, row){
  let val = col.type==="computed" ? col.compute(row) : row[col.key];
  if(val===undefined || val==="") return '<span style="color:var(--line);">—</span>';
  if(col.badge){
    return `<span class="badge ${col.badgeClass(val)}">${val}</span>`;
  }
  if(col.type==="number" && (col.key==="amount"||col.key==="base"||col.key==="bonus"||col.key==="overtime"||col.key==="deduction")){
    return "$"+val;
  }
  return val;
}

function filteredData(key){
  const s = SCHEMA[key];
  const term = (filters[key]||"").trim().toLowerCase();
  const withIdx = s.data.map((r,i)=>({...r, __idx:i}));
  if(!term) return withIdx;
  return withIdx.filter(r => s.columns.some(c=>{
    const v = c.type==="computed" ? c.compute(r) : r[c.key];
    return (v+"").toLowerCase().includes(term);
  }));
}

/* =========================================================
   DATA CLEANING (staff list + student profile list)
   - trims stray/duplicate spaces from every text field
   - reformats phone numbers into consistent "xxx xxx xxx" groups
   - removes fully-duplicate records (same identity + phone)
========================================================= */
function normalizePhone(v){
  if(!v) return v;
  const digits = v.replace(/[^\d+]/g,'');
  if(!digits) return "";
  const plus = digits.startsWith('+') ? '+' : '';
  const numPart = digits.replace(/^\+/,'');
  const grouped = (numPart.match(/.{1,3}/g)||[numPart]).join(' ');
  return plus+grouped;
}

function cleanRecord(record){
  let changed = false;
  Object.keys(record).forEach(k=>{
    const v = record[k];
    if(typeof v !== "string") return;
    let nv = v.trim().replace(/\s+/g," ");
    if(/phone/i.test(k)){
      nv = normalizePhone(nv);
    }
    if(nv !== v){
      record[k] = nv;
      changed = true;
    }
  });
  return changed;
}

function cleanData(key){
  const s = SCHEMA[key];
  let fixedCount = 0;
  s.data.forEach(r=>{ if(cleanRecord(r)) fixedCount++; });

  const idField = key==="staff" ? "idnum" : "name";
  const seen = new Set();
  const before = s.data.length;
  s.data = s.data.filter(r=>{
    const idVal = (r[idField]||r.name||"").trim().toLowerCase();
    if(!idVal) return true; // never auto-delete rows we can't identify
    const phoneVal = (r.phone||r.personalPhone||"").replace(/\s+/g,"");
    const sig = idVal+"|"+phoneVal;
    if(seen.has(sig)) return false;
    seen.add(sig);
    return true;
  });
  const removedCount = before - s.data.length;

  if(currentSection===key){
    contentEl.innerHTML = renderModulePanel(key);
    attachPanelEvents(key);
  }

  if(fixedCount===0 && removedCount===0){
    showToast("ទិន្នន័យស្អាតរួចហើយ គ្មានអ្វីត្រូវកែតម្រូវ");
  } else {
    showToast(`បានសម្អាតទិន្នន័យ៖ កែតម្រូវ ${fixedCount} កំណត់ត្រា, លុបទិន្នន័យស្ទួន ${removedCount}`);
    saveSheet(key);
  }
}

function attachPanelEvents(key){
  const searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', e=>{
    filters[key] = e.target.value;
    contentEl.innerHTML = renderModulePanel(key);
    attachPanelEvents(key);
    document.getElementById('searchBox').focus();
    document.getElementById('searchBox').setSelectionRange(999,999);
  });
  document.getElementById('addBtn').addEventListener('click', ()=> openModal(key));
  const cleanBtn = document.getElementById('cleanBtn');
  if(cleanBtn){
    cleanBtn.addEventListener('click', ()=> cleanData(key));
  }
  contentEl.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = Number(btn.dataset.realidx);
      SCHEMA[key].data.splice(i,1);
      contentEl.innerHTML = renderModulePanel(key);
      attachPanelEvents(key);
      showToast("បានលុបទិន្នន័យ");
      saveSheet(key);
    });
  });
}

      <input type="${c.type==='number'?'number':c.type==='date'?'date':'text'}" data-field="${c.key}" placeholder="${c.placeholder||''}">

  }).join('');

}
function closeModal(){ overlay.classList.remove('active'); modalKey=null; }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.getElementById('modalSave').addEventListener('click', ()=>{
  if(!modalKey) return;
  const s = SCHEMA[modalKey];
  const record = {};
  let missingRequired = false;
  modalBody.querySelectorAll('[data-field]').forEach(el=>{
    record[el.dataset.field] = el.value;
  });
  s.columns.forEach(c=>{
    if(c.required && !record[c.key]){ missingRequired = true; }
  });
  if(missingRequired){
    showToast("សូមបំពេញព័ត៌មានចាំបាច់ឱ្យបានគ្រប់គ្រាន់", true);
    return;
  }
  s.data.push(record);
  closeModal();
  if(currentSection===modalKey){
    contentEl.innerHTML = renderModulePanel(modalKey);
    attachPanelEvents(modalKey);
  }
  showToast("បានរក្សាទុកទិន្នន័យដោយជោគជ័យ");
  saveSheet(modalKey);
});

          <thead><tr><th>ឈ្មោះសិស្ស</th><th>ភេទ</th><th>ថ្នាក់</th><th>មុខវិជ្ជាសិក្សា</th><th>ម៉ោងសិក្សា</th><th>លេខទូរស័ព្ទ</th></tr></thead>
          <tbody>
            ${recent.length===0? `<tr class="empty-row"><td colspan="6">មិនទាន់មានទិន្នន័យ</td></tr>` :
            recent.map(r=>`<tr><td>${r.name||'—'}</td><td>${r.gender||'—'}</td><td>${r.grade||'—'}</td><td>${r.subjects||'—'}</td><td>${r.studyHours||'—'}</td><td>${r.phone||'—'}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function attachNewStudentForm(){
  const form = document.getElementById('newStudentForm');
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const record = {};
    form.querySelectorAll('[data-field]').forEach(el=> record[el.dataset.field]=el.value);
    if(!record.name){ showToast("សូមបញ្ចូលឈ្មោះសិស្ស", true); return; }
    SCHEMA.students.data.push(record);
    showToast("បានចុះឈ្មោះសិស្សថ្មីដោយជោគជ័យ");
    contentEl.innerHTML = renderNewStudentForm();
    attachNewStudentForm();
    saveSheet('students');
  });
  document.getElementById('clearForm').addEventListener('click', ()=>{
    form.querySelectorAll('[data-field]').forEach(el=> el.value="");
  });
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.querySelector('.dot').style.background = isError ? 'var(--lacquer)' : 'var(--gold)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

   INIT
========================================================= */
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('km-KH', {year:'numeric', month:'long', day:'numeric'});
document.getElementById('hamburger').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
buildNav();
goTo('overview');
fetchAllData();
</script>
